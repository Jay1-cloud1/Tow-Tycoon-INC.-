name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            zip
          pacboy: >-
            gcc:p cmake:p ninja:p pkgconf:p
            SDL2:p SDL2_image:p SDL2_ttf:p

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package
        run: |
          version=$(sed -n 's/^project(TowTycoon VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          name="TowTycoon-${version}-windows-x64"
          mkdir -p "dist/${name}/licenses"
          cp build/TowTycoon.exe build/*.dll "dist/${name}/"
          cp -r build/assets "dist/${name}/assets"
          cp LICENSE.txt README.md THIRD_PARTY_NOTICES.md "dist/${name}/"
          # Ship the license text of every bundled third-party DLL.
          for dll in "dist/${name}"/*.dll; do
            pkg=$(pacman -Qqo "/ucrt64/bin/$(basename "$dll")" 2>/dev/null || true)
            short=${pkg#mingw-w64-ucrt-x86_64-}
            if [ -n "$short" ] && [ -d "/ucrt64/share/licenses/${short}" ]; then
              cp -r "/ucrt64/share/licenses/${short}" "dist/${name}/licenses/"
            fi
          done
          (cd dist && zip -r "${name}.zip" "${name}")
          echo "ZIP_NAME=${name}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: dist/${{ env.ZIP_NAME }}.zip

      - name: Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          files: dist/${{ env.ZIP_NAME }}.zip
